<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club303 radiologger</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- TOEGEVOEGD (William, 6 sept 2026): eigen achtergrondkleur kiezen
         (de standaard witte achtergrond was te fel). Gebruikt de
         kleurenkiezer die elke browser al ingebouwd heeft (RGB +
         helderheid/verzadiging zit daar al in) -- zie achtergrondkleur.js
         voor de werking + het opslaan in een cookie. -->
    <div style="text-align: right; margin: 4px 8px; font: 11px Arial; color: #777;">
        <label for="achtergrondKleurKiezer">Background color:</label>
        <input type="color" id="achtergrondKleurKiezer" value="#ffffff">
        <a href="#" id="achtergrondKleurStandaard" style="color: #777;">(reset)</a>
    </div>
    <!-- TOEGEVOEGD (William, 6 sept 2026): tijd + bestandsnaam nu in een
         eigen "doosje" (vaste lichte achtergrond + rand), zodat deze tekst
         leesbaar blijft ongeacht welke achtergrondkleur hierboven gekozen
         is (bij donkere kleuren was de tekst bijna onleesbaar). -->
    <div style="text-align: center;">
        <div id="infoBalk">
            <span id="time-total">0:00 / 0:00</span><br>
            <!-- TOEGEVOEGD (William, 5 sept 2026): laat zien welk bestand er
                 nu geladen wordt / speelt, overgenomen uit StreamLogger.
                 Wordt gevuld door extra.js. -->
            <span id="huidigBestand"></span>
        </div>
    </div>
    <!-- TOEGEVOEGD: waveform zit nu in een "wrapper"-div, zodat de
         voortgangsbalk (laadVoortgang) er precies overheen gelegd kan
         worden tijdens het laden. -->
    <div id="waveformWrapper">
        <div id="waveform"></div>
        <div id="laadVoortgang">
            <span id="laadVoortgangTekst">Downloading...</span>
            <div id="laadVoortgangBalkAchtergrond">
                <div id="laadVoortgangBalkVulling"></div>
            </div>
        </div>
    </div>
    <div style="text-align: center; margin-top: 10px;">
        <button data-value="-60" class="skip-button">-1m</button>
        <button data-value="-10" class="skip-button">-10s</button>
        <button data-value="-1" class="skip-button">-1s</button>
        <button id="playPauseButton">Play</button>
        <button data-value="1" class="skip-button">+1s</button>
        <button data-value="10" class="skip-button">+10s</button>
        <button data-value="60" class="skip-button">+1m</button>
    </div>
    <div style="text-align: center; margin-top: 5px;">
        <a id="downloadbutton" class="button">Download recording</a>
        <button id="createStartButton">Selection Start</button>
        <button id="createEndButton">Selection End</button>
        <button id="deleteRegionButton">Delete Selection</button>
        <button id="playRegionButton" disabled>Play Selection</button>
        <button id="downloadRegionButton" disabled>Download Selection</button>
    </div>
    <br>
    <!-- TOEGEVOEGD (William, 6 sept 2026): nieuwe, zichtbare bediening voor
         zender/datum/uur. Vervangt het vrije tekstveld door een keuzelijst
         met ALLE 24 uren, waarbij niet-bestaande uren grijs/niet-klikbaar
         zijn (optie B uit de demo's) -- gevuld met echte gegevens uit
         /api/settings + /api/settings2 (zie datumkiezer.js).

         De originele bediening hieronder (stringSelector/dateTimeSelector/
         load) is nog gewoon aanwezig maar verborgen: main.js verwacht die
         elementen en zou vastlopen als ze er niet meer waren. datumkiezer.js
         vult ze zelf in en "klikt" op de oude, verborgen knop -- main.js
         doet daarna precies zijn normale werk (url opbouwen, piekbestand
         ophalen, golfvorm laden), helemaal ongewijzigd. -->
    <div style="text-align: center; margin-top: 5px;">
        <select id="zenderKeuzeNieuw"></select>
        <!-- TOEGEVOEGD (William, 6 sept 2026): dagnaam + datumveld nu samen in
             één "doosje" (#datumGroep), zodat het als één geheel oogt in
             plaats van losse tekst naast de datumkiezer. Wordt bijgewerkt
             door datumkiezer.js. -->
        <span id="datumGroep">
            <span id="datumDagNaam"></span>
            <input type="date" id="datumKeuzeNieuw">
        </span>
        <!-- TOEGEVOEGD (William, 8 sept 2026): "pulldownblok" -- de select
             hieronder blijft bestaan (en bevat de echte waarde die
             datumkiezer.js/laadKnop gebruiken), maar is verborgen. Zichtbaar
             is nu de knop + het paneel met het 4x6 uren-grid eronder. -->
        <span id="uurPulldown">
            <select id="uurKeuzeNieuw" style="display:none;"></select>
            <button type="button" id="uurTriggerKnop">Kies uur</button>
            <div id="uurPaneel" style="display:none;"></div>
        </span>
        <button id="laadKnopNieuw">Load!</button>
    </div>
    <p id="geenOpnamesDieDag" style="display:none; text-align:center; color:#555;">
        No recordings on this day for this station.
    </p>

    <div style="display:none;">
        <select id="stringSelector"></select>
        <input type="text" id="dateTimeSelector">
        <button id="load">Load! (old, hidden)</button>
    </div>
    <p style="color:red; font-size:30px; display: none;" id="downloadWait">Preparing download, please wait!</p>
    <!-- TOEGEVOEGD (William, 6 sept 2026): duidelijke melding als er voor de
         gekozen zender/datum/tijd geen opname bestaat (zie extra.js). -->
    <p id="laadFout"></p>
    <script src="./main.js" type="module"></script>
    <!-- TOEGEVOEGD (William, 5 sept 2026): losse, leesbare toevoeging voor
         de bestandsnaam-weergave + voortgangsbalk. Raakt main.js zelf niet
         aan (zie extra.js voor de volledige toelichting). -->
    <script src="./extra.js" type="module"></script>
    <!-- TOEGEVOEGD (William, 6 sept 2026): de nieuwe zender/datum/uur-
         bediening hierboven. Leest /api/settings + /api/settings2 uit en
         stuurt de verborgen, originele bediening aan (zie de toelichting
         daar). -->
    <script src="./datumkiezer.js" type="module"></script>
    <!-- TOEGEVOEGD (William, 6 sept 2026): de achtergrondkleur-kiezer
         hierboven. -->
    <script src="./achtergrondkleur.js" type="module"></script>
</body>
</html>
